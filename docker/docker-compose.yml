services:
  deye-backend:
    container_name: deye-backend
    build:
      context: ..
      dockerfile: ./docker/Dockerfile.backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MQTT_BROKER=192.168.201.2
      - MQTT_BROKER_PORT=1883
      - MQTT_TOPIC_PREFIX=deye
      - STATUS_READ_INTERVAL_SEC=30
      - INVERTER_IP=192.168.201.253
      - INVERTER_SERIAL=3510378990
      - INVERTER_DEFINITION=deye_hybrid.yaml
      - ACCESS_KEY=${ACCESS_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    labels:
      - glance.name=Deye Backend
      - glance.hide=false
      - glance.icon=di:deye
      - glance.description=Deye MQTT Backend
    networks:
      - deye-network

  deye-frontend:
    container_name: deye-frontend
    build:
      context: ..
      dockerfile: ./docker/Dockerfile.frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-8070}:80"
    environment:
      # Multi-facility support: use indexed env vars
      # Add BACKEND_URL2, BACKEND_WS_URL2, BACKEND_ACCESS_KEY2, FACILITY_NAME2 for a second facility, etc.
      - BACKEND_URL1=${BACKEND_URL1:-http://deye-backend:8000}
      - BACKEND_WS_URL1=${BACKEND_WS_URL1:-}
      - BACKEND_ACCESS_KEY1=${BACKEND_ACCESS_KEY1:-${ACCESS_KEY:-}}
      - FACILITY_NAME1=${FACILITY_NAME1:-Facility 1}
    labels:
      - glance.name=Deye Frontend
      - glance.hide=false
      - glance.icon=di:deye
      - glance.description=Deye Frontend UI
    networks:
      - deye-network

networks:
  deye-network:
    driver: bridge
